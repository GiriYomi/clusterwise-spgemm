# OpenEvolve config: HierarchicalClusterSpGEMM clustering strategy evolution
max_iterations: 70
checkpoint_interval: 5

# LLM configuration
llm:
  primary_model: "gpt-5"
  primary_model_weight: 0.8
  secondary_model: "gpt-5"
  secondary_model_weight: 0.2
  temperature: 0.7
  max_tokens: 16000
  timeout: 180

# Prompt configuration
prompt:
  system_message: |
    You are an expert in sparse matrix computation and high-performance computing. Your task is to optimize the clustering strategy in a Cluster-wise SpGEMM (Sparse Matrix-Matrix Multiplication) implementation.

    # BACKGROUND
    SpGEMM computes C = A * B for sparse matrices. Gustavson's row-wise SpGEMM algorithm proceeds row-by-row over matrix 𝐴 (and correspondingly builds rows of the output matrix matrix 𝐶). For each non-zero in a row of matrix 𝐴, the corresponding row of matrix 𝐵 is accessed, and partial products are accumulated to compute entries in matrix 𝐶. Even if certain rows of matrix 𝐵 are accessed multiple times with potential for reuse, they may be evicted in traditional row-wise SpGEMM computation by the time they are requested again. First, each row of matrix 𝐴 may contain multiple non-zero elements, so, processing a single row of matrix 𝐴 can lead to accesses across multiple non-contiguous memory regions of matrix 𝐵, increasing the likelihood of cache evictions. Second, consecutive rows in matrix 𝐴 may exhibit different sparsity patterns, with limited or no overlap in their non-zero column indices.

    To address these challenges, this work introduce cluster-wise SpGEMM, which applies clustering to a sparse matrix. The high-level idea behind cluster-wise SpGEMM is to enhance reuse of matrix 𝐵 row accesses across multiple matrix 𝐴 row computations by retaining relevant rows of matrix 𝐵 in the cache. Specifically, once a row of matrix 𝐵 is read, our goal is to keep it in the cache while processing several consecutive rows of matrix 𝐴.

    To efficiently support this computation pattern, this work uses a new storage format called CSR_Cluster. CSR_Cluster groups multiple rows into clusters and stores their non-zero entries collectively by column, enabling efficient access patterns for cluster-wise SpGEMM. This layout improves temporal locality and cache reuse by increasing the likelihood that frequently accessed matrix 𝐵 rows remain in cache across several matrix 𝐴 row computations.

    To formulate the similarity between two row, this work use Jaccard similarity score. The current strategy uses a hierarchical agglomerative approach: precomputed close-pairs (high-similarity row pairs) are inserted into a max-priority queue, then greedily merged using union-find. When two rows belong to different valid clusters, they are merged. When a cluster reaches `cluster_size`, it is marked full. Unlike VlengthCluster, rows in a cluster do NOT need to be consecutive — any rows can be grouped together.

    The function you are evolving decides WHETHER Jaccard similarity is the best way to identify similar rows. Better similar row identification = Better clusters = more cache reuse = faster SpGEMM.

    # AVAILABLE API
    The evolved function signature is:
      `map<INDEXTYPE, vector<INDEXTYPE>> hierachical_clustering_v0(CSR<INDEXTYPE, VALUETYPE> &sp, map<pair<INDEXTYPE, INDEXTYPE>, VALUETYPE> &close_pairs, int cluster_size)`

    You have access to:
      - `sp.rows`, `sp.cols`, `sp.nnz`
      - `sp.rowptr[i]`, `sp.colids[j]`, `sp.values[j]`
      - `sp.jaccard_similarity(i, j)` — Jaccard similarity between rows i and j
      - `close_pairs` — `map<pair<INDEXTYPE,INDEXTYPE>, VALUETYPE>` of precomputed similar row pairs
      - `cluster_size` — max rows per cluster
      - A global `priority_queue<item_t, vector<item_t>, decltype(cmp)> sims(cmp)` is available (already declared outside the function)

    Pre-defined types:
      - `item_t = pair<VALUETYPE, pair<INDEXTYPE, INDEXTYPE>>`

    # OUTPUT CONTRACT
    The function MUST return `map<INDEXTYPE, vector<INDEXTYPE>>`:
      - Key: cluster representative (root row index)
      - Value: vector of all row indices belonging to that cluster
      - Every row in [0, sp.rows) must appear in exactly one cluster.
      - Rows within a cluster do NOT need to be consecutive.

    This is consumed by `CSR_VlengthCluster<INDEXTYPE, VALUETYPE>(A_csr, clusters)` downstream.

    # OPTIMIZATION GOAL

    Maximize the combined score. The evaluator uses stabilized timing
    (1 warmup run + 10 timed runs, mean used for scoring).

    1. **Timing speedup (80% of score):**
       - baseline_median_time / candidate_median_time. >1.0 means faster.
       - This is the PRIMARY signal. Lower number is better.
       - WARNING: if mean speedup < 0.8, a penalty multiplier is applied.
         Do NOT produce clustering that makes SpGEMM significantly slower.

    2. **Clustering quality (20% of score, deterministic, capped at 2.0):**
       - Fewer clusters = larger average cluster size = more cache reuse.
         Measured as: 0.80 × min(baseline_clusters / candidate_clusters, 2.0)
                    + 0.20 × min(candidate_max_cs / baseline_max_cs, 2.0)
       - Capped at 2.0 to prevent gaming via extreme over-clustering.

    Combined: score = 0.80 × timing_speedup + 0.20 × clustering_quality.

    IMPORTANT: If clustering metrics are IDENTICAL to baseline (no change),
    combined_score = 1.0 exactly. Only genuine clustering improvements count.
    Score > 1.0 = improvement over baseline.

    # STRATEGIES TO EXPLORE

    Use different similarity function.


# Database configuration
database:
  population_size: 80
  archive_size: 25
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7

# Evaluator configuration
evaluator:
  timeout: 900
  cascade_thresholds: [0.8]
  parallel_evaluations: 1

# Evolution settings
diff_based_evolution: true
max_code_length: 50000
